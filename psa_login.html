<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSA Ozamiz | eGov Staff Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="login-page-body">
    <div class="login-container border-top-gov">
        <div class="row g-0">
            <div class="col-md-6 d-none d-md-flex egov-banner">
                <div class="mb-4">
                    <span class="badge bg-warning text-dark mb-2 px-3 py-2 rounded-pill">Republic of the Philippines</span>
                </div>
                <h1 class="display-6 fw-bold mb-3">PSA Ozamiz <br><span style="color: var(--egov-cyan);">Staff Portal</span></h1>
                <p class="lead text-white-50">Single Sign-On interface for standardizing Civil Registry processes.</p>
                
                <div class="mt-4">
                    <div class="d-flex align-items-center mb-3">
                        <i class="bi bi-check-circle-fill text-warning fs-4 me-3"></i>
                        <span>Secure Government Gateway</span>
                    </div>
                    <div class="d-flex align-items-center mb-3">
                        <i class="bi bi-check-circle-fill text-warning fs-4 me-3"></i>
                        <span>Audit-ready transaction tracking</span>
                    </div>
                </div>
            </div>

            <div class="col-md-6 form-section">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 rounded-circle mb-3" style="background: rgba(13, 110, 253, 0.1);">
                        <i class="bi bi-fingerprint fs-1" style="color: var(--egov-navy);"></i>
                    </div>
                    <h4 class="fw-bold text-dark">Welcome Back</h4>
                    <p class="text-muted small">Log in with your PSA credentials</p>
                </div>

                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="user" placeholder="Username">
                    <label for="user"><i class="bi bi-person me-2"></i>Username</label>
                </div>
                
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="pass" placeholder="Password">
                    <label for="pass"><i class="bi bi-lock me-2"></i>Password</label>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember">
                        <label class="form-check-label small text-muted" for="remember">Remember computer</label>
                    </div>
                    <a href="#" class="small text-decoration-none" style="color: var(--egov-blue);">Reset Key?</a>
                </div>

                <button class="btn btn-egov w-100 py-3 fw-bold rounded-3 shadow-sm" onclick="login()">
                    Sign In <i class="bi bi-arrow-right-short fs-5"></i>
                </button>

                <div class="text-center mt-4">
                    <hr>
                    <small class="text-muted">Need help? <a href="mailto:support@ozamiz.psa.gov.ph" class="text-decoration-none">Contact IT Support</a></small>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Keeping your robust redirection logic untouched!
        async function login() {
            const btn = document.querySelector('button[onclick="login()"]');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Authenticating...';
            btn.disabled = true;

            const username = document.getElementById('user').value;
            const password = document.getElementById('pass').value;

            try {
                const response = await fetch('api/api_login.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    if (data.role.toLowerCase() === 'admin') {
                        window.location.href = 'admin/admin_dashboard.html';
                    } else if (data.role.toLowerCase() === 'staff') {
                        window.location.href = 'staff/staff_dashboard.html';
                    } else {
                        alert("Role not recognized. Contact System Admin.");
                        resetBtn(btn);
                    }
                } else {
                    alert(data.message);
                    resetBtn(btn);
                }
            } catch (error) {
                console.error("Login Error:", error);
                resetBtn(btn);
            }
        }

        function resetBtn(btn) {
            btn.innerHTML = 'Sign In <i class="bi bi-arrow-right-short fs-5"></i>';
            btn.disabled = false;
        }
    </script>
</body>
</html>
