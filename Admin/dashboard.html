<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard - PSA Supply</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="container">
        <h2 id="welcomeMessage">Welcome, Admin</h2>
        <p><a href="../logout.php">Logout</a></p>

        <h3>Menu</h3>
        <ul>
            <li><a href="manage_users.html">Manage Users</a></li>
            <li><a href="manage_inventory.html">Manage Inventory</a></li>
            <li><a href="view_requests.html">View Requests</a></li>
        </ul>
    </div>

    <script>
        // Fetch admin name from backend session
        async function loadAdminInfo() {
            try {
                const response = await fetch('../api/get_session.php'); // PHP endpoint
                const data = await response.json();

                if (data.role !== 'admin') {
                    alert('Unauthorized access!');
                    window.location = '../login.html';
                } else {
                    document.getElementById('welcomeMessage').textContent =
                        'Welcome, ' + data.name + ' (Admin)';
                }
            } catch (err) {
                console.error('Error fetching session:', err);
                alert('Error! Please login again.');
                window.location = '../login.html';
            }
        }

        window.onload = loadAdminInfo;
    </script>
</body>
</html>
