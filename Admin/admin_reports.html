<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reports | PSA Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <h3 class="fw-bold mb-3">Inventory Reports</h3>

    <div class="row g-3">
        
        <div class="col-md-4">
            <div class="card shadow-sm p-3">
                <h6>Total Forms Sold</h6>
                <h3 id="totalSold">0</h3>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm p-3">
                <h6>Total Stock Received</h6>
                <h3 id="totalReceived">0</h3>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm p-3">
                <h6>Total Returns</h6>
                <h3 id="totalReturned">0</h3>
            </div>
        </div>

    </div>

    <div class="mt-4">
        <button class="btn btn-primary" onclick="window.print()">
            Print Report
        </button>
    </div>
</div>

<script>
async function loadReports() {
    const response = await fetch('../api/get_reports.php');
    const data = await response.json();

    document.getElementById('totalSold').textContent = data.total_sold;
    document.getElementById('totalReceived').textContent = data.total_received;
    document.getElementById('totalReturned').textContent = data.total_returned;
}

loadReports();
</script>

</body>
</html>
